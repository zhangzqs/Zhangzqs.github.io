<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <marker id="arrow-icc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-icc-speed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="40" text-anchor="middle" font-size="28" fill="#1f2937">前进左转时的瞬时曲率中心</text>

  <path d="M 190 300 A 70 70 0 0 0 120 230 A 70 70 0 0 0 50 300" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-icc)"/>
  <circle cx="120" cy="300" r="8" fill="#d97706"/>
  <text x="72" y="286" font-size="22" fill="#1f2937">ICC</text>
  <text x="66" y="214" font-size="20" fill="#d97706">ω &gt; 0</text>

  <line x1="520" y1="300" x2="165" y2="300" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-icc-speed)"/>
  <text x="310" y="285" font-size="20" fill="#2563eb">y_B（左）</text>

  <rect x="450" y="225" width="140" height="150" rx="18" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M 475 225 L 520 195 L 565 225" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="480" y1="300" x2="560" y2="300" stroke="#1f2937" stroke-width="3"/>
  <rect x="468" y="255" width="24" height="90" rx="6" fill="#1f2937"/>
  <rect x="548" y="255" width="24" height="90" rx="6" fill="#1f2937"/>
  <circle cx="520" cy="300" r="8" fill="#d97706"/>
  <text x="530" y="326" font-size="20" fill="#1f2937">C</text>

  <line x1="480" y1="255" x2="480" y2="145" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-icc-speed)"/>
  <line x1="560" y1="255" x2="560" y2="88" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-icc-speed)"/>
  <text x="444" y="140" font-size="20" fill="#2563eb">v_L</text>
  <text x="578" y="90" font-size="20" fill="#2563eb">v_R</text>
  <text x="612" y="145" font-size="20" fill="#1f2937">v_R &gt; v_L &gt; 0</text>

  <path d="M 120 300 L 120 350 L 480 350 L 480 300" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="245" y="336" width="112" height="24" fill="#f8fafc"/>
  <text x="301" y="355" text-anchor="middle" font-size="18" fill="#d97706">R - L/2</text>

  <path d="M 120 300 L 120 389 L 520 389 L 520 300" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="275" y="375" width="90" height="24" fill="#f8fafc"/>
  <text x="320" y="394" text-anchor="middle" font-size="18" fill="#2563eb">R &gt; 0</text>

  <path d="M 120 300 L 120 428 L 560 428 L 560 300" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="285" y="414" width="112" height="24" fill="#f8fafc"/>
  <text x="341" y="433" text-anchor="middle" font-size="18" fill="#1f2937">R + L/2</text>
</svg>
