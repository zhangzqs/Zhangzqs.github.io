<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <marker id="arrow-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-wheel-motion" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <line x1="266" y1="0" x2="266" y2="480" stroke="#1f2937" stroke-width="2"/>
  <line x1="533" y1="0" x2="533" y2="480" stroke="#1f2937" stroke-width="2"/>

  <text x="133" y="42" text-anchor="middle" font-size="26" fill="#1f2937">直行</text>
  <path d="M 133 385 L 133 92" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-motion)"/>
  <g>
    <rect x="88" y="190" width="90" height="140" rx="15" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
    <path d="M 105 190 L 133 168 L 161 190" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="74" y="220" width="20" height="80" rx="5" fill="#1f2937"/>
    <rect x="172" y="220" width="20" height="80" rx="5" fill="#1f2937"/>
  </g>
  <text x="133" y="420" text-anchor="middle" font-size="20" fill="#1f2937">v_L = v_R</text>
  <text x="133" y="450" text-anchor="middle" font-size="20" fill="#1f2937">ω = 0</text>

  <text x="400" y="42" text-anchor="middle" font-size="26" fill="#1f2937">原地旋转</text>
  <path d="M 470 342 A 105 105 0 1 0 330 342" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-motion)"/>
  <g>
    <rect x="355" y="190" width="90" height="140" rx="15" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
    <path d="M 372 190 L 400 168 L 428 190" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="341" y="220" width="20" height="80" rx="5" fill="#1f2937"/>
    <rect x="439" y="220" width="20" height="80" rx="5" fill="#1f2937"/>
    <circle cx="400" cy="260" r="7" fill="#d97706"/>
    <line x1="329" y1="220" x2="329" y2="300" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-wheel-motion)"/>
    <line x1="471" y1="300" x2="471" y2="220" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-wheel-motion)"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-size="20" fill="#1f2937">v_L = -v_R</text>
  <text x="400" y="450" text-anchor="middle" font-size="20" fill="#1f2937">v = 0</text>

  <text x="667" y="42" text-anchor="middle" font-size="26" fill="#1f2937">圆弧</text>
  <path d="M 710 395 C 710 292 672 168 595 90" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-motion)"/>
  <g>
    <rect x="622" y="190" width="90" height="140" rx="15" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
    <path d="M 639 190 L 667 168 L 695 190" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="608" y="220" width="20" height="80" rx="5" fill="#1f2937"/>
    <rect x="706" y="220" width="20" height="80" rx="5" fill="#1f2937"/>
    <line x1="618" y1="250" x2="618" y2="176" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-wheel-motion)"/>
    <line x1="716" y1="250" x2="716" y2="115" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-wheel-motion)"/>
  </g>
  <text x="667" y="420" text-anchor="middle" font-size="20" fill="#1f2937">v_R &gt; v_L</text>
  <text x="667" y="450" text-anchor="middle" font-size="20" fill="#1f2937">ω &gt; 0</text>
</svg>
