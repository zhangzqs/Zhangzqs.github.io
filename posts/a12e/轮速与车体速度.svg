<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <marker id="arrow-speed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-turn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="480" fill="#f8fafc"/>
  <text x="400" y="40" text-anchor="middle" font-size="28" fill="#1f2937">轮速决定平移与转动</text>

  <rect x="300" y="230" width="200" height="140" rx="20" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M 340 230 L 400 195 L 460 230" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="250" y1="300" x2="550" y2="300" stroke="#1f2937" stroke-width="3"/>
  <rect x="230" y="255" width="40" height="90" rx="8" fill="#1f2937"/>
  <rect x="530" y="255" width="40" height="90" rx="8" fill="#1f2937"/>
  <circle cx="400" cy="300" r="8" fill="#d97706"/>
  <text x="414" y="325" font-size="20" fill="#1f2937">C</text>

  <line x1="250" y1="255" x2="250" y2="145" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-speed)"/>
  <line x1="550" y1="255" x2="550" y2="90" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-speed)"/>
  <line x1="400" y1="290" x2="400" y2="125" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-speed)"/>
  <text x="215" y="140" font-size="22" fill="#2563eb">v_L</text>
  <text x="570" y="92" font-size="22" fill="#2563eb">v_R</text>
  <text x="414" y="145" font-size="22" fill="#2563eb">v</text>

  <path d="M 350 335 A 64 64 0 0 0 450 335" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-turn)"/>
  <text x="466" y="350" font-size="24" fill="#d97706">ω</text>

  <text x="400" y="415" text-anchor="middle" font-size="24" fill="#1f2937">v = (v_R + v_L) / 2</text>
  <text x="400" y="455" text-anchor="middle" font-size="24" fill="#1f2937">ω = (v_R - v_L) / L</text>
</svg>
